# compbench configuration — see DESIGN.md for the full schema.
images:
  - alpine:3.23
  - golang:1.26

methods:
  - stdlib-gzip
  - kp-gzip
  - kp-pgzip
  - kp-pgzip-seq          # pgzip held to one block in flight; same bytes, one core
  - kp-zstd
  - zstd-cgo               # skipped unless built with `-tags cgo_zstd` (CGO_ENABLED=1)
  - external: { name: pigz,     cmd: [pigz, "-{level}", -c], decmd: [pigz, -d, -c] }
  # The zstd CLI defaults to nbWorkers=0 (single-threaded), so `zstd-cli` measures
  # one core — same as kp-zstd and zstd-cgo, neither of which can enable libzstd's
  # multithreading. `zstd-cli-mt` adds -T0 (one worker per core) and is the only
  # entry in the matrix that compresses a single stream on more than one core
  # besides pgzip. -T is a compress-side option; decmd is left alone.
  - external: { name: zstd-cli,    cmd: [zstd, "-{level}", -c],      decmd: [zstd, -d, -c],
                rawLevels: { fast: "1", default: "3", best: "19" } }
  - external: { name: zstd-cli-mt, cmd: [zstd, "-{level}", -T0, -c], decmd: [zstd, -d, -c],
                rawLevels: { fast: "1", default: "3", best: "19" } }

# "best" (gzip -9 / zstd-19) is omitted: slow for marginal ratio gain. A method
# can still opt in with its own `levels:`, e.g. `- { name: kp-zstd, levels: [fast, default, best] }`.
levels: [fast, default]
ops: [compress, decompress]
bufferSizes: [64KiB, 1MiB]
jobConcurrency: [1, 2]
iterations: 3
gap: 500ms

corpus: .corpus
results: results
