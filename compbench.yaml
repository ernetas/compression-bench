# compbench configuration — see DESIGN.md for the full schema.
images:
  - alpine:3.23
  - golang:1.26

methods:
  - stdlib-gzip
  - kp-gzip
  - kp-pgzip
  - kp-pgzip-seq          # pgzip held to one block in flight; same bytes, one core
  - kp-zstd
  - zstd-cgo               # skipped unless built with `-tags cgo_zstd` (CGO_ENABLED=1)
  - external: { name: pigz,     cmd: [pigz, "-{level}", -c], decmd: [pigz, -d, -c] }
  # Both entries pin -T explicitly. The zstd CLI has been multi-threaded by
  # DEFAULT since 1.5.x (measured: plain `zstd -3` runs ~4x cores), so a bare
  # `zstd -{level}` is not a single-core baseline and silently makes libzstd look
  # several times faster than kp-zstd and zstd-cgo, which are single-threaded and
  # cannot be told otherwise. -T1 and -T0 make the two rows mean what they say.
  # -T is a compress-side option; decmd is left alone.
  - external: { name: zstd-cli,    cmd: [zstd, "-{level}", -T1, -c], decmd: [zstd, -d, -c],
                rawLevels: { fast: "1", default: "3", best: "19" } }
  - external: { name: zstd-cli-mt, cmd: [zstd, "-{level}", -T0, -c], decmd: [zstd, -d, -c],
                rawLevels: { fast: "1", default: "3", best: "19" } }

# "best" (gzip -9 / zstd-19) is omitted: slow for marginal ratio gain. A method
# can still opt in with its own `levels:`, e.g. `- { name: kp-zstd, levels: [fast, default, best] }`.
levels: [fast, default]
ops: [compress, decompress]
bufferSizes: [64KiB, 1MiB]
jobConcurrency: [1, 2]
iterations: 3
gap: 500ms

corpus: .corpus
results: results
