# compbench configuration — see DESIGN.md for the full schema.
images:
  - alpine:3.23
  - golang:1.26

methods:
  - stdlib-gzip
  - kp-gzip
  - kp-pgzip
  - kp-pgzip-b1          # pgzip with one block in flight; same bytes, ~2 cores
  - kp-zstd
  - zstd-cgo               # skipped unless built with `-tags cgo_zstd` (CGO_ENABLED=1)
  - external: { name: pigz,     cmd: [pigz, "-{level}", -c], decmd: [pigz, -d, -c] }
  # All three pin their thread mode explicitly, because none of the defaults mean
  # what they look like. The zstd CLI has been multi-threaded by DEFAULT since
  # 1.5.x (measured: plain `zstd -3` runs ~4x cores), so a bare `zstd -{level}`
  # is not a single-core baseline. And -T1 is not single-threaded either: it
  # takes the MT path with one worker, which costs a full round buffer
  # (measured 54.2 MiB against --single-thread's 15.6 MiB) and, more to the
  # point, emits DIFFERENT BYTES than --single-thread. Worker count does not
  # change the output; crossing between the MT and non-MT paths does.
  #
  #   zstd -3 --single-thread  1.01x cores   15.6 MiB  sha 06abf458c944c35c
  #   zstd -3 -T1              1.03x cores   54.2 MiB  sha ab6a1cfd9f48e692
  #   zstd -3 -T0              7.02x cores  189.7 MiB  sha ab6a1cfd9f48e692
  #
  # That byte split is why all three rows are kept: for anything depending on
  # reproducible layer digests, "did we use the MT path at all" is a real axis,
  # while "how many workers" is not. -T is compress-side; decmd is left alone.
  - external: { name: zstd-cli-st, cmd: [zstd, "-{level}", --single-thread, -c], decmd: [zstd, -d, -c],
                rawLevels: { fast: "1", default: "3", best: "19" } }
  - external: { name: zstd-cli,    cmd: [zstd, "-{level}", -T1, -c], decmd: [zstd, -d, -c],
                rawLevels: { fast: "1", default: "3", best: "19" } }
  - external: { name: zstd-cli-mt, cmd: [zstd, "-{level}", -T0, -c], decmd: [zstd, -d, -c],
                rawLevels: { fast: "1", default: "3", best: "19" } }

# "best" (gzip -9 / zstd-19) is omitted: slow for marginal ratio gain. A method
# can still opt in with its own `levels:`, e.g. `- { name: kp-zstd, levels: [fast, default, best] }`.
levels: [fast, default]
ops: [compress, decompress]
bufferSizes: [64KiB, 1MiB]
jobConcurrency: [1, 2]
iterations: 3
gap: 500ms

corpus: .corpus
results: results
